<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng ký ca trực · Shine</title>
<style>
  :root { font: 15px/1.5 system-ui, sans-serif; color: #183429; background: #f0f6f1; }
  * { box-sizing: border-box; }
  body { margin: 0; }
  main { max-width: 1080px; padding: clamp(20px, 5vw, 58px); margin: auto; }
  header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 14px; margin-bottom: 21px; }
  h1 { margin: 0; font-size: clamp(1.8rem, 5vw, 2.65rem); letter-spacing: -.035em; }
  p { margin: 0; }
  .date, .hint { color: #50675a; }
  .hint { margin: 2px 0 16px; }
  .badge { border: 1px solid #cadcd0; background: white; border-radius: 25px; padding: 6px 12px; font-weight: 700; }
  .badge[data-open="true"] { color: #185334; background: #dbf1e1; border-color: #b4d5bf; }
  .calendar { display: grid; gap: 9px; }
  section { background: #fff; border: 1px solid #d5e2d9; border-radius: 12px; padding: 13px; display: grid; grid-template-columns: 140px repeat(3, minmax(0, 1fr)); gap: 10px; }
  h2 { font-size: 1rem; margin: 0; }
  h2 .date { display: block; font-size: .85rem; font-weight: 500; }
  .slot { min-width: 0; }
  .hour { display: block; color: #456054; font-size: .83rem; margin-bottom: 4px; }
  .assignment, summary { min-height: 38px; padding: 7px 10px; border-radius: 7px; overflow-wrap: anywhere; }
  .assignment { background: #eaf4ec; font-weight: 650; }
  .assignment.empty { background: #f1f4f2; font-weight: 450; color: #52665b; }
  details { position: relative; }
  summary { color: #175539; border: 1px solid #c4dacc; background: #fff; cursor: pointer; }
  details[open] summary { background: #eaf4ec; }
  .dropdown { position: absolute; z-index: 2; top: calc(100% + 4px); left: 0; right: 0; border: 1px solid #bdd7c6; background: #fff; border-radius: 8px; box-shadow: 0 9px 24px #203e2c28; padding: 6px; }
  input, button { font: inherit; }
  input { width: 100%; border: 1px solid #bfd2c6; border-radius: 5px; padding: 6px; }
  button { cursor: pointer; }
  .choices { max-height: 176px; overflow: auto; margin-top: 4px; }
  .choice { width: 100%; text-align: left; display: block; border: 0; background: white; padding: 6px; color: inherit; overflow-wrap: anywhere; }
  .choice:hover, .choice:focus-visible { background: #e6f3e9; }
  .role { display: block; color: #50675a; font-size: .76rem; }
  .message { position: fixed; right: 14px; bottom: 14px; max-width: min(430px, calc(100% - 28px)); background: #215d43; color: white; padding: 9px 13px; border-radius: 8px; z-index: 4; }
  .message:empty { display: none; }
  .message[data-error="true"] { background: #8b322c; }
  dialog { width: min(400px, calc(100% - 28px)); border: 1px solid #c4dacc; border-radius: 12px; padding: 20px; color: inherit; }
  dialog::backdrop { background: #18342999; }
  dialog label { display: block; margin: 10px 0; }
  .admin-actions { display: flex; justify-content: flex-end; gap: 8px; }
  #admin-error { color: #8b322c; margin-bottom: 8px; }
  #refresh, #admin-toggle, .admin-actions button { background: white; border: 1px solid #c4dacc; border-radius: 8px; color: #175539; padding: 6px 12px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  :focus-visible { outline: 2px solid #1b7150; outline-offset: 2px; }
  @media (max-width: 650px) {
    section { grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 10px; gap: 7px; }
    h2 { grid-column: 1 / -1; }
    h2 .date { display: inline; margin-left: 8px; }
    .assignment, summary { padding: 6px; font-size: .89rem; }
    .dropdown { min-width: 155px; right: auto; }
    .slot:last-child .dropdown { right: 0; left: auto; }
  }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Đăng ký ca trực</h1>
      <p class="date" id="week"></p>
    </div>
    <div class="toolbar">
      <span class="badge" id="state">Đang tải lịch</span>
      <button type="button" id="admin-toggle" hidden>Khoá/Mở đăng ký</button>
      <button type="button" id="refresh">Làm mới</button>
    </div>
  </header>
  <p class="hint">Mặc định mở từ 00:00 đến 12:00 thứ Hai, giờ Việt Nam. Ca đã có người sẽ được khoá.</p>
  <div class="calendar" id="calendar"></div>
  <p class="message" id="message" role="status"></p>
</main>
<dialog id="admin-dialog" aria-labelledby="admin-title">
  <form id="admin-form">
    <h2 id="admin-title">Xác thực Admin</h2>
    <label>Tài khoản <input id="admin-account" autocomplete="username" maxlength="200" required></label>
    <label>Mật khẩu <input id="admin-password" type="password" autocomplete="current-password" maxlength="500" required></label>
    <p id="admin-error" role="alert"></p>
    <div class="admin-actions">
      <button type="button" id="admin-cancel">Huỷ</button>
      <button type="submit" id="admin-submit">Xác nhận</button>
    </div>
  </form>
</dialog>
<script>
"use strict";

// Chỉ điền URL Web app /exec khi đăng file này lên hosting riêng.
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyFWNzUhH8NQaaAKccv2wZJtbB8w9twlbnkq2J4k17Jzy-1vpf9futGavW8xM19T-tC/exec";
const calendar = document.getElementById("calendar");
const state = document.getElementById("state");
const week = document.getElementById("week");
const message = document.getElementById("message");
const refresh = document.getElementById("refresh");
const adminToggle = document.getElementById("admin-toggle");
const adminDialog = document.getElementById("admin-dialog");
const adminForm = document.getElementById("admin-form");
const adminAccount = document.getElementById("admin-account");
const adminPassword = document.getElementById("admin-password");
const adminError = document.getElementById("admin-error");
const adminSubmit = document.getElementById("admin-submit");
const adminCancel = document.getElementById("admin-cancel");
let adminTarget;
let schedule = null;
let busy = false;
let messageTimer;

function showMessage(text, error = false) {
  clearTimeout(messageTimer);
  message.textContent = text;
  message.dataset.error = String(error);
  if (text && !error) messageTimer = setTimeout(() => { message.textContent = ""; }, 3500);
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function normalize(text) {
  return text.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").trim();
}

function dateLabel(date, withYear = false) {
  const [year, month, day] = date.split("-");
  return day + "/" + month + (withYear ? "/" + year : "");
}

function createPicker(day, hour, slot) {
  const picker = el("details");
  const summary = el("summary", "", "Chọn tên");
  summary.setAttribute("aria-label", "Chọn tên · " + day + " · " + hour);
  const dropdown = el("div", "dropdown");
  const input = el("input");
  input.type = "search";
  input.placeholder = "Gõ tên…";
  input.setAttribute("aria-label", "Tìm tên nhân viên");
  const choices = el("div", "choices");

  function updateChoices() {
    const query = normalize(input.value);
    const matches = schedule.staff.filter(person => normalize(person.name).includes(query));
    const items = matches.map(person => {
      const button = el("button", "choice", person.name);
      button.type = "button";
      button.append(el("span", "role", person.role));
      button.addEventListener("click", () => {
        if (busy) {
          showMessage("Đang tải lịch. Vui lòng chọn lại sau vài giây.", true);
          return;
        }
        picker.open = false;
        void load({action: "register", week: schedule.week, slot, name: person.name});
      });
      return button;
    });
    choices.replaceChildren(...(items.length ? items : [el("p", "role", "Không tìm thấy nhân viên.")]));
  }
  picker.addEventListener("toggle", () => {
    if (!picker.open) return;
    calendar.querySelectorAll("details[open]").forEach(other => {
      if (other !== picker) other.open = false;
    });
    input.value = "";
    updateChoices();
    input.focus();
  });
  input.addEventListener("input", updateChoices);
  dropdown.addEventListener("keydown", event => {
    if (event.key === "Escape") {
      picker.open = false;
      summary.focus();
    } else if (event.key === "ArrowDown" && event.target === input) {
      event.preventDefault();
      choices.querySelector("button")?.focus();
    }
  });
  dropdown.append(input, choices);
  picker.append(summary, dropdown);
  return picker;
}

function render() {
  state.textContent = schedule.open ? "Đang mở đăng ký" : "Đã đóng đăng ký";
  adminToggle.hidden = false;
  adminToggle.textContent = schedule.open ? "Khoá đăng ký" : "Mở đăng ký";
  state.dataset.open = String(schedule.open);
  week.textContent = dateLabel(schedule.week) + " – " + dateLabel(schedule.dates[6], true);
  const days = schedule.days.map((day, dayIndex) => {
    const row = el("section");
    const title = el("h2", "", day);
    title.append(el("span", "date", dateLabel(schedule.dates[dayIndex])));
    row.append(title);
    schedule.hours.forEach((hour, hourIndex) => {
      const slot = dayIndex * 3 + hourIndex;
      const cell = el("div", "slot");
      const name = schedule.shifts[slot];
      cell.append(el("span", "hour", hour));
      if (name || !schedule.open) {
        cell.append(el("div", name ? "assignment" : "assignment empty", name || "Ca trống"));
      } else {
        cell.append(createPicker(day, hour, slot));
      }
      row.append(cell);
    });
    return row;
  });
  calendar.replaceChildren(...days);
}

async function api(request) {
  const runner = globalThis.google?.script?.run;
  if (runner) {
    return new Promise((resolve, reject) => {
      const timeout = setTimeout(() => reject(new Error("Hết thời gian chờ")), 25000);
      runner.withSuccessHandler(result => {
        clearTimeout(timeout);
        resolve(result);
      }).withFailureHandler(error => {
        clearTimeout(timeout);
        reject(error);
      }).xuLyCaTruc(request);
    });
  }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec$/.test(WEB_APP_URL)) {
    throw new Error("Mở URL Web app của Apps Script hoặc cấu hình WEB_APP_URL trong file HTML.");
  }
  const response = await fetch(WEB_APP_URL, {
    method: "POST", body: JSON.stringify(request), credentials: "omit",
    signal: AbortSignal.timeout(25000)
  });
  if (!response.ok) throw new Error("Không đọc được lịch từ Apps Script.");
  return response.json();
}

const errors = {
  taken: "Ca này vừa được người khác đăng ký.",
  closed: "Đã hết giờ đăng ký ca trực.",
  changed: "Đã sang tuần mới. Vui lòng chọn lại ca.",
  name: "Tên này không còn trong danh sách nhân viên.",
  busy: "Hệ thống đang lưu một lượt đăng ký khác. Vui lòng thử lại.",
  unavailable: "Chưa kết nối được với Sheet Ca trực. Kiểm tra cài đặt Apps Script.",
  invalid: "Yêu cầu không hợp lệ."
};

async function load(request = {action: "view"}, background = false) {
  if (busy || adminDialog.open) return;
  const writing = request.action === "register";
  let refreshAfter = false;
  busy = true;
  if (writing) {
    calendar.inert = true;
    showMessage("Đang lưu ca…");
  }
  refresh.disabled = true;
  try {
    const result = await api(request);
    if (result.status !== "ok") {
      if (!background) showMessage(errors[result.status] || errors.unavailable, true);
      refreshAfter = writing;
      if (!schedule) state.textContent = "Chưa tải được lịch";
      return;
    }
    const changed = JSON.stringify(schedule) !== JSON.stringify(result);
    schedule = result;
    if (changed || writing) render();
    if (writing) showMessage("Đã đăng ký ca trực.");
  } catch (error) {
    if (!schedule) state.textContent = "Chưa tải được lịch";
    if (!background) showMessage(writing ? "Chưa xác nhận được lần lưu. Đang tải lại lịch." : error.message, true);
    refreshAfter = writing;
  } finally {
    busy = false;
    refresh.disabled = false;
    calendar.inert = false;
    if (refreshAfter) void load({action: "view"}, true);
  }
}

adminToggle.addEventListener("click", () => {
  if (busy || !schedule) return;
  adminTarget = {week: schedule.week, open: !schedule.open};
  adminForm.reset();
  adminError.textContent = "";
  adminSubmit.textContent = adminToggle.textContent;
  adminDialog.showModal();
});
adminCancel.addEventListener("click", () => adminDialog.close());
adminDialog.addEventListener("cancel", event => {
  if (busy) event.preventDefault();
});
adminDialog.addEventListener("close", () => adminForm.reset());
adminForm.addEventListener("submit", async event => {
  event.preventDefault();
  if (busy) return;
  busy = true;
  adminSubmit.disabled = adminCancel.disabled = true;
  adminError.textContent = "";
  const request = {action: "setOpen", ...adminTarget, username: adminAccount.value, password: adminPassword.value};
  adminPassword.value = "";
  let reload = false;
  try {
    const result = await api(request);
    if (result.status === "ok") {
      schedule = result;
      adminDialog.close();
      render();
      showMessage(schedule.open ? "Đã mở đăng ký." : "Đã khoá đăng ký.");
    } else if (result.status === "changed") {
      adminDialog.close();
      showMessage(errors.changed, true);
      reload = true;
    } else {
      adminError.textContent = result.status === "admin_required"
        ? "Vui lòng nhập đúng tài khoản admin"
        : errors[result.status] || errors.unavailable;
    }
  } catch (_) {
    adminError.textContent = "Chưa xác nhận được trạng thái đăng ký. Vui lòng thử lại.";
  } finally {
    adminSubmit.disabled = adminCancel.disabled = false;
    busy = false;
    if (reload) void load({action: "view"}, true);
  }
});

refresh.addEventListener("click", () => {
  showMessage("");
  void load();
});
document.addEventListener("click", event => {
  calendar.querySelectorAll("details[open]").forEach(picker => {
    if (!picker.contains(event.target)) picker.open = false;
  });
});
document.addEventListener("visibilitychange", () => {
  if (!document.hidden) void load({action: "view"}, true);
});
setInterval(() => {
  if (!document.hidden && !calendar.querySelector("details[open]")) void load({action: "view"}, true);
}, 20000);
void load();
</script>
</body>
</html>
